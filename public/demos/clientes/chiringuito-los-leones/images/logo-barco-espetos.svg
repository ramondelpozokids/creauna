    <path d="M40 200c55-18 110 18 165 0s110-18 165 0 110 18 165 0 110-18 165 0 110 18 165 0 110-18 165 0"/>
    <path d="M40 230c55-18 110 18 165 0s110-18 165 0 110 18 165 0 110-18 165 0 110 18 165 0 110-18 165 0"/>
    <path d="M40 260c55-18 110 18 165 0s110-18 165 0 110 18 165 0 110-18 165 0 110 18 165 0 110-18 165 0"/>
  </g>

  <!-- CLEAR fishing boat / barca de espetos (side profile, prow left) -->
